name: model3_transformer
seed: 42
model:
  type: transformer
  d_model: 256
  num_heads: 8
  num_layers: 3
  ffn_dim: 1024
  dropout: 0.1
optimizer:
  name: adamw
  lr: 0.0005
  warmup_steps: 2000
  weight_decay: 0.01
training:
  batch_size: 32
  max_epochs: 30
  grad_clip: 5.0
  teacher_forcing: 1.0
  amp: true
loss:
  label_smoothing: 0.1
early_stopping:
  monitor: val_loss
  patience: 5
evaluation:
  select_by: val_cider
  cider_every: 2
  batch_size: 64
