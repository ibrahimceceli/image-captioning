# Model 2: Show-Attend-and-Tell style attention LSTM (src/models/attention_lstm.py).
# Shared data settings (vocab, split, max_length, seed) live in base.yaml.
name: model2_attention_lstm
seed: 42

model:
  type: attention_lstm
  embedding_dim: 256
  hidden_dim: 512
  attention_dim: 512
  dropout: 0.5

features:
  cache: resnet50_layer4   # [B, 2048, 7, 7] or [B, 49, 2048]

optimizer:
  name: adam
  lr: 0.001

training:
  batch_size: 32
  max_epochs: 30
  grad_clip: 5.0
  teacher_forcing: 1.0
  amp: true

loss:
  name: cross_entropy
  ignore_pad: true

data:
  train_fraction: 1.0

early_stopping:
  monitor: val_loss
  patience: 5

evaluation:
  select_by: val_cider
  cider_every: 2
  batch_size: 64
